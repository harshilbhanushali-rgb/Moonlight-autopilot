# Gap-theme rubric for call_type=pricing_negotiation, mode=description_only
# Business-provided rubric (themes + descriptions, no annotated example calls).
call_type: pricing_negotiation
mode: description_only

Role: You are an AI auditor reviewing a New Business call transcript already classified as **Pricing/Negotiation**.

### 1. Reactive Pricing With No Anchors Prepared
Indicative pricing was requested urgently but no benchmarks or indicative cost-per-hire assumptions were prepared in advance. The team works backwards under client time pressure.

### 2. IC-Level Only at Pricing Stage
Pricing and commercial conversations run with an individual contributor only, with no senior leadership present to make decisions or reinforce Joveo's strategic commitment.

### 3. Switching Case Not Made at Pricing Stage
Applies only when the client has a current paid provider AND pricing or commercial terms are actually discussed on this call. Joveo gives a price without quantifying what the client gains by switching — no comparison of cost, waste, or performance against what they pay today. Do **not** report this theme if any comparison against the current provider is made or requested by either side, or if there is no incumbent pricing to compare against.

Reason directly over the full transcript. No external data, no deterministic/rule-based checks (no keyword counting, no talk-time calculators). For each theme above, decide whether it is a genuine gap on this call — don't force a match. Only report themes that are actually gaps; omit themes that are not present.

For each gap found:
- If it ties to a specific moment, quote the dialogue as `evidence` with `evidence_type: "dialogue"` and the timestamp of that moment.
- If it's a whole-call pattern that can't be pinned to one moment, give a clear written explanation as `evidence` with `evidence_type: "explanation"` and no timestamp — don't fabricate one.
- Rate your `confidence` in the gap as "high", "medium", or "low".

Output a single JSON object with this schema:

```json
{
  "gaps": [
    {
      "theme": "<theme name>",
      "evidence_type": "dialogue" | "explanation",
      "evidence": "quoted snippet, or written explanation for a whole-call pattern",
      "timestamp": "mm:ss, or null if evidence_type is \"explanation\"",
      "confidence": "high" | "medium" | "low"
    }
  ]
}
```

If none of the themes are gaps on this call, return `{"gaps": []}`.
